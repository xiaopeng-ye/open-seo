name: Publish prebuilt image

# Builds the NexoFlux prebuilt OpenSEO image and pushes it to GHCR.
#
# One image per official upstream release: the tag is the version in
# package.json, and the build is SKIPPED when that tag is already in the
# registry. Upstream pushes commits far more often than it cuts a release
# (78 commits in 30 days, one release), so without that check every sync would
# rebuild the same tag with different bytes and drift the digest out from under
# whatever is deployed.
#
# Upstream's own image compiles the app at *container start*, which needs a
# multi-GB Node heap on the Docker host; this workflow does that compile once on
# a runner instead. See docker/Dockerfile.prebuilt.
#
# Off this repo: a daily Hermes cron rebases this fork onto upstream and pushes
# to main, and that push is what runs this workflow. Deployment is the usual
# Renovate PR bumping the image tag in docker/open-seo/compose.yaml.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild even if this version's tag already exists (use after changing Dockerfile.prebuilt)"
        type: boolean
        default: false

permissions:
  contents: read
  packages: write # push to GHCR

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version from package.json
        id: ver
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check whether this version is already published
        id: check
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${{ github.repository }}:${{ steps.ver.outputs.version }}"
          if docker buildx imagetools inspect "$IMAGE" >/dev/null 2>&1; then
            echo "exists=true" >>"$GITHUB_OUTPUT"
            echo "$IMAGE already published — nothing to do."
          else
            echo "exists=false" >>"$GITHUB_OUTPUT"
            echo "$IMAGE not published yet — building."
          fi

      - name: Build and push
        if: steps.check.outputs.exists != 'true' || inputs.force
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.prebuilt
          # The Docker host is amd64 only; skip the arm64 leg.
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.ver.outputs.version }}
            ghcr.io/${{ github.repository }}:latest
          labels: |
            org.opencontainers.image.title=OpenSEO (NexoFlux prebuilt)
            org.opencontainers.image.version=${{ steps.ver.outputs.version }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.description=Prebuilt OpenSEO self-host image: app compiled at image build time instead of container start.
