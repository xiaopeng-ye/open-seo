name: Publish prebuilt image

# Builds the NexoFlux prebuilt OpenSEO image and pushes it to GHCR.
#
# Upstream's published image compiles the app at *container start*, which needs a
# multi-GB Node heap on the Docker host. This workflow does that compile once, on
# a GitHub-hosted runner, and publishes the result so the container only serves.
# See docker/Dockerfile.prebuilt.
#
# The weekly run first fast-forwards this fork from the public upstream via the
# fork-sync API, then rebuilds, so the image tracks upstream releases with no
# manual step.

on:
  push:
    branches: [main]
    tags: ["v*"]
  schedule:
    # Mondays 04:00 UTC: pull upstream changes in, then rebuild.
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write # merge-upstream writes to this fork's main
  packages: write # push to GHCR

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      # Deliberately before checkout, and deliberately without any `|| echo`:
      # an earlier revision of this workflow hid a failure behind a fallback, so
      # every run reported success while the weekly upstream sync was dead. If
      # this step cannot reach upstream, the build must go red.
      #
      # merge-upstream only works while this repository is a real fork of
      # every-app/open-seo. If the fork link is ever lost (a public → private →
      # public visibility round trip severs it), it returns 422 and this fails
      # loudly rather than shipping a stale image forever.
      - name: Sync fork from upstream
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh api -X POST "repos/${GITHUB_REPOSITORY}/merge-upstream" -f branch=main

      - uses: actions/checkout@v4

      - name: Resolve version from package.json
        id: ver
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.prebuilt
          # The Docker host is amd64 only; skip the arm64 leg.
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.ver.outputs.version }}
            ghcr.io/${{ github.repository }}:latest
          labels: |
            org.opencontainers.image.title=OpenSEO (NexoFlux prebuilt)
            org.opencontainers.image.version=${{ steps.ver.outputs.version }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.description=Prebuilt OpenSEO self-host image: app compiled at image build time instead of container start.
