name: Publish prebuilt image

# Builds the NexoFlux prebuilt OpenSEO image and pushes it to GHCR.
#
# Upstream's published image compiles the app at *container start*, which needs a
# multi-GB Node heap on the Docker host. This workflow does that compile once, on
# a GitHub-hosted runner, and publishes the result so the container only serves.
# See docker/Dockerfile.prebuilt.
#
# The weekly run first syncs this private fork from the public upstream, then
# rebuilds, so the image tracks upstream releases without a manual step.

on:
  push:
    branches: [main]
    tags: ["v*"]
  schedule:
    # Mondays 04:00 UTC: pull upstream changes in, then rebuild.
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write # push the upstream merge back to main
  packages: write # push to GHCR

env:
  UPSTREAM_REPO: https://github.com/every-app/open-seo.git
  UPSTREAM_BRANCH: main

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The upstream sync below merges, which needs real history. The default
          # single-commit clone cannot merge.
          fetch-depth: 0

      - name: Sync from upstream
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail

          # Deliberately plain git rather than the merge-upstream API: that
          # endpoint returns an unexplained 422 once this fork is private, and a
          # silently dead sync is worse than no sync. The public upstream is
          # fetchable without credentials, and any failure here fails the build.
          git remote add upstream "$UPSTREAM_REPO" 2>/dev/null \
            || git remote set-url upstream "$UPSTREAM_REPO"
          git fetch --no-tags upstream "$UPSTREAM_BRANCH"

          if git merge-base --is-ancestor "upstream/$UPSTREAM_BRANCH" HEAD; then
            echo "Already up to date with upstream ($(git rev-parse --short "upstream/$UPSTREAM_BRANCH"))."
            exit 0
          fi

          echo "Upstream has moved: merging $(git rev-parse --short "upstream/$UPSTREAM_BRANCH") into main."
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge --no-edit "upstream/$UPSTREAM_BRANCH"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Resolve version from package.json
        id: ver
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.prebuilt
          # The Docker host is amd64 only; skip the arm64 leg.
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.ver.outputs.version }}
            ghcr.io/${{ github.repository }}:latest
          labels: |
            org.opencontainers.image.title=OpenSEO (NexoFlux prebuilt)
            org.opencontainers.image.version=${{ steps.ver.outputs.version }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.description=Prebuilt OpenSEO self-host image: app compiled at image build time instead of container start.
